name: Build and publish APK
on:
  push:
    paths:
      - Matgary-final.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: unzip -q Matgary-final.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle -p Matgary :app:assembleDebug --stacktrace
      - name: Publish the APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Matgary/app/build/outputs/apk/debug/app-debug.apk matgary.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest matgary.apk --latest --target "$GITHUB_SHA" --title "Matgary build ${{ github.run_number }}" --notes "Newest build. Download matgary.apk and install it over the old one."